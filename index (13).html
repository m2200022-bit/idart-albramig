<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة الأنظمة الإلكترونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* هوية واحدة: الشريط العنّابي الرسمي مع جدول تشغيل قابل للفرز */
:root{
  --bg:#f3f4f2; --fg:#1c1f1d; --muted:#6b716c; --line:#dde0dc; --surface:#ffffff;
  --ui-accent:#8a1538; --ui-on:#ffffff;
  --f-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --f-kufi:'Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-readex:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-naskh:'Amiri','Times New Roman',serif;
  --ok:#15803d; --ok-bg:#e7f5ec; --off:#b42318; --off-bg:#fdecea;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121413; --fg:#e8eae7; --muted:#9aa19c; --line:#2a2e2b; --surface:#1a1d1b;
  --ui-accent:#b8325a; --ok:#4ade80; --ok-bg:#12301d; --off:#f87171; --off-bg:#3a1513; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121413; --fg:#e8eae7; --muted:#9aa19c; --line:#2a2e2b; --surface:#1a1d1b;
  --ui-accent:#b8325a; --ok:#4ade80; --ok-bg:#12301d; --off:#f87171; --off-bg:#3a1513; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.55;direction:rtl;min-height:100vh}
button,input,select,textarea{font-family:inherit}
svg.ic{width:16px;height:16px;flex-shrink:0}
.shell{max-width:1200px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer}
.icon-btn:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.icon-btn.unlocked{background:var(--ui-accent);color:var(--ui-on);border-color:var(--ui-accent)}
.logout-link{font-size:12.5px;color:var(--muted);text-decoration:none;padding:0 6px}
.logout-link:hover{color:var(--off)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,th[data-sort]:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;opacity:.7}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.on{color:var(--ok);background:var(--ok-bg)}
.status.off{color:var(--off);background:var(--off-bg)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.off::before{background:var(--off)}
.emo{font-size:17px;line-height:1}
.fav{border:0;background:transparent;font-size:15px;cursor:pointer;padding:2px;color:var(--line)}
.fav.on{color:#d49b00}
.sel{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;border-radius:6px}
.mini{font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:4px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--fg);border-color:var(--muted)}
.mini.danger:hover{color:var(--off);border-color:var(--off)}
.add-btn{font-size:12.5px;font-weight:600;border:0;background:var(--ui-accent);color:var(--ui-on);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}

/* ============ الهوية الموحّدة: العنّابي الرسمي + لوحة التشغيل ============ */
.cA{--a-bg:#faf7f6;--a-surface:#ffffff;--a-ink:#2a1a1e;--a-muted:#7a666b;--a-line:#ecdfe1;--a-zebra:#fbf6f7;--a-soft:#f5e7eb;--a-maroon:#8a1538;--a-maroon-d:#5e0d26;--a-on:#ffffff;--a-gold:#b8925a;
  background:var(--a-bg);color:var(--a-ink);border:1px solid var(--a-line);border-radius:4px;overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cA{--a-bg:#1a1214;--a-surface:#22181b;--a-ink:#f3e9eb;--a-muted:#b59fa5;--a-line:#3a2a2f;--a-zebra:#261b1e;--a-soft:#3a1e26;--a-maroon:#b8325a;--a-maroon-d:#4a0b1e;--a-gold:#d4b07a}}
:root[data-theme="dark"] .cA{--a-bg:#1a1214;--a-surface:#22181b;--a-ink:#f3e9eb;--a-muted:#b59fa5;--a-line:#3a2a2f;--a-zebra:#261b1e;--a-soft:#3a1e26;--a-maroon:#b8325a;--a-maroon-d:#4a0b1e;--a-gold:#d4b07a}

/* الشريط العلوي */
.cA .band{background:var(--a-maroon-d);color:#fff;padding:20px 24px 26px;display:flex;flex-direction:column;gap:18px;position:relative}
.cA .band::after{content:"";position:absolute;inset:auto 0 0 0;height:10px;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.14) 6px 9px)}
.cA .band-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.cA .crest{display:flex;align-items:center;gap:14px}
.cA .seal{width:50px;height:50px;border:1.5px solid var(--a-gold);color:var(--a-gold);display:grid;place-items:center;font-family:var(--f-kufi);font-weight:800;font-size:20px;border-radius:50%;flex-shrink:0}
.cA .crest h1{font-family:var(--f-kufi);font-size:19px;margin:0;text-wrap:balance}
.cA .crest small{display:flex;flex-wrap:wrap;gap:4px 10px;opacity:.85;font-size:12px}
.cA .band .icon-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.cA .band .icon-btn:hover{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4)}
.cA .band .icon-btn.unlocked{background:var(--a-gold);border-color:var(--a-gold);color:#2a1a1e}
.cA .band .logout-link{color:rgba(255,255,255,.75)}
.cA .band .logout-link:hover{color:#fff}
.cA .summary{display:flex;flex-wrap:wrap;row-gap:10px;font-size:12.5px}
.cA .summary span{padding:0 16px;border-inline-start:1px solid rgba(255,255,255,.25)}
.cA .summary span:first-child{padding-inline-start:0;border:0}
.cA .summary b{font-family:var(--f-kufi);font-size:18px;display:block;color:var(--a-gold)}
.cA .summary .warn b{color:#ffb4a8}

/* أدوات التصفية */
.cA .tools{display:flex;flex-wrap:wrap;gap:10px;padding:14px 24px;align-items:center;justify-content:space-between;background:var(--a-surface)}
.cA .chips{display:flex;flex-wrap:wrap;gap:6px}
.cA .chips button{font-size:12.5px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-ink);padding:5px 12px;border-radius:2px;cursor:pointer}
.cA .chips button span{color:var(--a-muted);font-size:11px;margin-inline-start:4px}
.cA .chips button[aria-pressed="true"]{background:var(--a-maroon);border-color:var(--a-maroon);color:var(--a-on)}
.cA .chips button[aria-pressed="true"] span{color:inherit;opacity:.8}
.cA .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cA .searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--a-line);background:var(--a-bg);padding:6px 10px;border-radius:2px;width:300px;max-width:100%}
.cA .searchbox:focus-within{border-color:var(--a-maroon)}
.cA .searchbox input{border:0;background:transparent;color:var(--a-ink);font:inherit;font-size:13px;flex:1;min-width:0;outline:none}
.cA kbd{font-family:var(--f-readex);font-size:11px;border:1px solid var(--a-line);border-bottom-width:2px;border-radius:4px;padding:0 6px;color:var(--a-muted)}
.cA .add-btn{background:var(--a-maroon);border-radius:2px}
.cA .tabs{display:flex;flex-wrap:wrap;gap:2px 18px;padding:0 24px;border-bottom:1px solid var(--a-line);background:var(--a-surface)}
.cA .tabs button{font-size:13px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--a-muted);padding:9px 0 8px;cursor:pointer}
.cA .tabs button:hover{color:var(--a-ink)}
.cA .tabs button[aria-pressed="true"]{color:var(--a-maroon);border-bottom-color:var(--a-maroon);font-weight:600}
.cA .tabs .sep{width:1px;background:var(--a-line);margin:8px 0}

/* الجدول */
.cA table{min-width:900px;background:var(--a-surface)}
.cA thead th{background:var(--a-maroon);color:var(--a-on);font-weight:600;font-size:12.5px;text-align:start;padding:11px 14px;white-space:nowrap;user-select:none}
.cA thead th[data-sort]{cursor:pointer}
.cA thead th[data-sort]:hover{background:var(--a-maroon-d)}
.cA thead th .arr{opacity:.45;margin-inline-start:5px;font-size:10px}
.cA thead th.sorted .arr{opacity:1;color:var(--a-gold)}
.cA tbody td{padding:10px 14px;border-bottom:1px solid var(--a-line);vertical-align:middle}
.cA tbody tr:nth-child(even){background:var(--a-zebra)}
.cA tbody tr:hover{box-shadow:inset -3px 0 0 var(--a-maroon)}
.cA tbody tr.is-off{opacity:.7}
.cA .idx{color:var(--a-muted);font-family:var(--f-kufi);font-size:12px;width:40px}
.cA .sysc{display:flex;gap:10px;align-items:center;min-width:240px}
.cA .ini{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;background:var(--a-soft);flex-shrink:0}
.cA .nm{font-weight:600}
.cA .ds{color:var(--a-muted);font-size:12px}
.cA .cat{font-size:12px;color:var(--a-ink);border:1px solid var(--a-line);border-radius:2px;padding:1px 8px;white-space:nowrap;background:var(--a-bg)}
.cA .bar{display:flex;align-items:center;gap:8px;min-width:130px}
.cA .bar i{display:block;height:6px;border-radius:1px;background:var(--a-maroon);opacity:.85}
.cA .bar span{font-size:12px;color:var(--a-muted)}
.cA .acts{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.cA .ghost{opacity:0;transition:opacity .15s}
.cA tr:hover .ghost,.cA tr:focus-within .ghost{opacity:1}
@media (hover:none){.cA .ghost{opacity:1}}
.cA .mini{border-radius:2px}
.cA .open{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--a-maroon);color:var(--a-maroon);padding:5px 12px;border-radius:2px;text-decoration:none;font-size:12.5px;font-weight:600;white-space:nowrap}
.cA .open:hover{background:var(--a-maroon);color:var(--a-on)}
.cA .foot{padding:12px 24px;color:var(--a-muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media (max-width:760px){
  .cA .band,.cA .tools,.cA .foot{padding-inline:16px}
  .cA .tabs{padding-inline:16px}
  .cA .searchbox{width:100%}
}

/* ============ النوافذ المنبثقة والإشعارات ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,11,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-overlay.show{display:flex}
.modal-card{background:var(--surface);color:var(--fg);border-radius:10px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;font-family:var(--f-kufi)}
.modal-close{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer}
.modal-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-start;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:7px;padding:9px 10px;background:var(--bg);color:var(--fg);font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ui-accent);outline:none}
.act-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;text-decoration:none}
.act-btn.primary{background:var(--ui-accent);color:var(--ui-on);border-color:var(--ui-accent);font-weight:600}
.icon-choice{width:36px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:18px;cursor:pointer}
.icon-choice.sel{border-color:var(--ui-accent);background:var(--surface);box-shadow:0 0 0 2px var(--ui-accent) inset}
.settings-section{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.settings-section h4{margin:0;font-size:13.5px}
.order-row,.cat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.order-row .nm,.cat-row .nm{flex:1}
.mini-btn{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.mini-btn:disabled{opacity:.35;cursor:default}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <section class="cA">
    <header class="band">
      <div class="band-row">
        <div class="crest">
          <div class="seal" id="brandSeal">إ</div>
          <div>
            <h1 id="brandName">بوابة الأنظمة الإلكترونية</h1>
            <small><span id="brandSub">إدارة الدعوة والإرشاد الديني</span><span class="sync js-sync off">جارِ الاتصال…</span></small>
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="lockBtn" title="مقفل — اضغط لإدخال كلمة المرور"></button>
          <button class="icon-btn" id="settingsBtn" title="الإعدادات"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg></button>
          <button class="icon-btn" id="refreshBtn" title="تحديث الصفحة"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></button>
          <button class="icon-btn" id="closeBtn" title="إغلاق"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
          <a href="#" class="logout-link" id="logoutLink">تسجيل الخروج</a>
        </div>
      </div>
      <div class="summary" id="summary"></div>
    </header>
    <div id="stage"></div>
  </section>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">إضافة نظام جديد</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="field"><label for="f_name">اسم النظام</label><input type="text" id="f_name" placeholder="مثال: النظام المالي"></div>
      <div class="field">
        <label>اختر الأيقونة الأنسب للبرنامج</label>
        <div id="iconPicker" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
        <input type="hidden" id="f_icon" value="📁">
      </div>
      <div class="field"><label for="f_category">التصنيف</label><select id="f_category"></select></div>
      <div class="field"><label for="f_desc">الوصف</label><textarea id="f_desc" rows="2" placeholder="وصف مختصر للنظام"></textarea></div>
      <div class="field"><label for="f_url">رابط الدخول</label><input type="text" id="f_url" placeholder="https:// أو اسم صفحة داخل البوابة"></div>
      <div class="field">
        <label for="f_html">رفع ملف HTML (بديل عن الرابط)</label>
        <input type="file" id="f_html" accept=".html,.htm">
        <div id="f_html_hint" style="font-size:11.5px;color:var(--muted);"></div>
      </div>
      <div class="field"><label for="f_status">الحالة</label>
        <select id="f_status"><option value="on">مفعّل</option><option value="off">معطّل</option></select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="act-btn primary" id="modalSave">حفظ</button>
      <button class="act-btn" id="modalCancel">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-card" style="max-width:600px;">
    <div class="modal-head">
      <h3>إعدادات البوابة</h3>
      <button class="modal-close" id="settingsClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="settings-section">
        <h4>اسم البوابة وأيقونتها</h4>
        <div class="field"><label for="set_name">اسم البوابة</label><input type="text" id="set_name" placeholder="بوابة الأنظمة الإلكترونية"></div>
        <div class="field"><label for="set_sub">السطر التعريفي تحت الاسم</label><input type="text" id="set_sub" placeholder="إدارة الدعوة والإرشاد الديني"></div>
        <div class="field"><label for="set_icon">أيقونة/شعار البوابة (حرف أو رمز تعبيري)</label><input type="text" id="set_icon" maxlength="4" placeholder="إ"></div>
        <button class="act-btn primary" id="saveBranding">حفظ الاسم والأيقونة</button>
      </div>

      <div class="settings-section">
        <h4>ترتيب الأنظمة في الجدول</h4>
        <div id="orderList"></div>
      </div>

      <div class="settings-section">
        <h4>إدارة التصنيفات</h4>
        <div id="catManageList"></div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="newCatIcon" maxlength="4" placeholder="🏷️" style="max-width:60px;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);">
          <input type="text" id="newCatName" placeholder="اسم تصنيف جديد" style="flex:1;min-width:0;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);">
          <button class="act-btn primary" id="addCatBtn">إضافة</button>
        </div>
      </div>

      <div class="settings-section">
        <h4>كلمة مرور التعديل والحذف</h4>
        <p style="font-size:12px;color:var(--muted);margin:0;">عند تعيين كلمة مرور، لن يُسمح بتعديل أو حذف أي نظام إلا بعد إدخالها.</p>
        <div class="field"><label for="set_curpass">كلمة المرور الحالية (اتركها فارغة إن لم تُعيَّن من قبل)</label><input type="password" id="set_curpass"></div>
        <div class="field"><label for="set_newpass">كلمة المرور الجديدة</label><input type="password" id="set_newpass" placeholder="اتركها فارغة لإلغاء الحماية"></div>

async function ensureSeeded(){
  try{
    const snap = await getDocs(collection(db, COL));
    if(snap.empty){ await Promise.all(SEED.map(s => setDoc(doc(db, COL, newId()), s))); }
    const catSnap = await getDocs(categoriesCol);
    if(catSnap.empty){ await Promise.all(DEFAULT_CATS.map(c => addDoc(categoriesCol, c))); }
    const cfgSnap = await getDoc(settingsDocRef);
    if(!cfgSnap.exists()){
      await setDoc(settingsDocRef, {portalName: PORTAL_NAME, portalIcon: PORTAL_ICON, adminPassword: ""});
    }
  }catch(e){
    console.error('ensureSeeded failed:', e);
    showToast('تعذّر الاتصال بقاعدة البيانات عند بدء التشغيل — تحقق من قواعد Firestore Rules');
  }
}

function subscribe(){
  onSnapshot(collection(db, COL), snap=>{
    SYSTEMS = snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.order??999)-(b.order??999));
    CATEGORIES = [...new Set(SYSTEMS.map(s=>s.category))];
    LOADED = true;
    fillCategorySelect();
    renderOrderList();
    setSyncStatus(true, 'متزامن');
  }, err=>{
    console.error(err);
    setSyncStatus(false, 'تعذّر الاتصال — تحقق من قواعد Firestore');
    showToast('تعذّر الاتصال بقاعدة البيانات، تحقق من الاتصال بالإنترنت');
  });

  onSnapshot(settingsDocRef, snap=>{
    if(snap.exists()){
      const d = snap.data();
      PORTAL_NAME = d.portalName || PORTAL_NAME;
      PORTAL_ICON = d.portalIcon || PORTAL_ICON;
      PORTAL_SUB = d.portalSub ?? PORTAL_SUB;
      ADMIN_PASSWORD = d.adminPassword || "";
      applyBranding();
    }
  }, err=> console.error(err));

  onSnapshot(categoriesCol, snap=>{
    CATS = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    fillCategorySelect();
    renderCatManageList();
  }, err=> console.error(err));
}

function applyBranding(){
  document.getElementById('brandSeal').textContent = PORTAL_ICON;
  document.getElementById('brandName').textContent = PORTAL_NAME;
  document.getElementById('brandSub').textContent = PORTAL_SUB;
  document.title = PORTAL_NAME;
}
function setSyncStatus(ok, label){
  SYNC = { ok, label };
  document.querySelectorAll('.js-sync').forEach(el=>{ el.classList.toggle('off', !ok); el.textContent = label; });
}

function catNames(){ return CATS.length ? CATS.map(c=>c.name) : CATEGORIES; }
function catIcon(n){ return (CATS.find(c=>c.name===n)||{}).icon || ''; }

function fillCategorySelect(){
  const names = catNames();
  if(filters.category!=="all" && !names.includes(filters.category)) filters.category = "all";
  const fcat = document.getElementById('f_category');
  const cur = fcat.value;
  fcat.innerHTML = CATS.map(c=>`<option value="${esc(c.name)}">${esc(c.icon||'')} ${esc(c.name)}</option>`).join("");
  if(names.includes(cur)) fcat.value = cur;
  renderTable();
}

function isUnlocked(){ return sessionStorage.getItem('gate_unlocked')==='1'; }

function getFiltered(){
  let list = SYSTEMS.filter(s=>{
    if(!isUnlocked() && s.status!=='on') return false;
    if(isUnlocked() && filters.status!=="all" && s.status!==filters.status) return false;
    if(filters.category!=="all" && s.category!==filters.category) return false;
    if(filters.q){
      const q = filters.q.toLowerCase();
      const hay = `${s.name} ${s.desc||""} ${s.category||""}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(filters.quick==="favorites") list = list.filter(s=>s.favorite);
  else if(filters.quick==="recent") list = list.filter(s=>s.lastOpened).sort((a,b)=>(b.lastOpened||0)-(a.lastOpened||0));
  else if(filters.quick==="popular") list = [...list].sort((a,b)=>(b.visits||0)-(a.visits||0));
  else if(filters.quick==="new") list = [...list].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(filters.sort.k){
    const k = filters.sort.k, dir = filters.sort.dir;
    list = [...list].sort((a,b)=>{
      const x = a[k] ?? '', y = b[k] ?? '';
      return (typeof x==='number' && typeof y==='number' ? x-y : String(x).localeCompare(String(y),'ar')) * dir;
    });
  }
  return list;
}

function esc(str){
  return String(str??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const fmt = n => Number(n||0).toLocaleString('ar');
function dateAr(d){ if(!d) return '—'; const p = String(d).split('-'); return p.length===3 ? `${+p[2]}/${+p[1]}/${p[0]}` : esc(d); }
function timeAgo(ts){
  if(!ts) return "";
  const diffMin = Math.floor((Date.now()-ts)/60000);
  if(diffMin < 1) return "الآن";
  if(diffMin < 60) return `منذ ${diffMin} دقيقة`;
  const h = Math.floor(diffMin/60);
  if(h < 24) return `منذ ${h} ساعة`;
  return `منذ ${Math.floor(h/24)} يوم`;
}

/* ---------------- Shared pieces for the three views ---------------- */
const QUICK = [['all','الكل'],['favorites','★ المفضلة'],['recent','آخر استخدام'],['popular','الأكثر استخدامًا'],['new','المضافة حديثًا']];
const QUICK_TITLES = { all:"الأنظمة والمواقع", favorites:"المفضلة", recent:"آخر الأنظمة استخدامًا", popular:"الأكثر استخدامًا", new:"المضافة حديثًا" };
function totals(){
  const on = SYSTEMS.filter(s=>s.status==='on').length;
  return { all:SYSTEMS.length, on, off:SYSTEMS.length-on, cats:CATEGORIES.length, visits:SYSTEMS.reduce((a,s)=>a+(s.visits||0),0) };
}
const statusPill = s => `<span class="status ${s.status==='on'?'on':'off'}">${s.status==='on'?'متاح':'معطّل'}</span>`;
const favBtn = s => `<button type="button" class="fav ${s.favorite?'on':''}" data-fav="${s.id}" title="مفضلة" aria-label="مفضلة">★</button>`;
const openLabel = s => s.htmlContent && (!s.url || s.url==='#') ? 'فتح الملف' : 'فتح النظام';
const openAttrs = s => `href="${esc(s.url)||'#'}" data-open data-id="${s.id}"`;
const adminBtns = (s, cls='') => isUnlocked() ? `
  <button type="button" class="mini ${cls}" data-toggle data-id="${s.id}">${s.status==='on'?'تعطيل':'تفعيل'}</button>
  <button type="button" class="mini ${cls}" data-edit data-id="${s.id}">تعديل</button>
  <button type="button" class="mini danger ${cls}" data-delete data-id="${s.id}">حذف</button>` : '';
const addBtn = () => isUnlocked() ? `<button type="button" class="add-btn" data-add>+ إضافة نظام</button>` : '';
const emptyText = () => LOADED ? 'لا توجد أنظمة مطابقة' : 'جارِ تحميل الأنظمة…';
const sync = () => `<span class="sync js-sync ${SYNC.ok?'':'off'}">${esc(SYNC.label)}</span>`;

/* ---------------- العرض الموحّد: العنّابي الرسمي + لوحة التشغيل ---------------- */
function renderSummary(){
  const t = totals();
  document.getElementById('summary').innerHTML = `
    <span><b class="num">${fmt(t.all)}</b>نظام</span>
    <span><b class="num">${fmt(t.on)}</b>متاح</span>
    ${isUnlocked()?`<span class="${t.off?'warn':''}"><b class="num">${fmt(t.off)}</b>معطّل</span>`:''}
    <span><b class="num">${fmt(t.cats)}</b>تصنيفات</span>
    <span><b class="num">${fmt(t.visits)}</b>زيارة إجمالًا</span>`;
}

function viewMerged(rows){
  const cats = catNames();
  const visible = SYSTEMS.filter(s=>isUnlocked() || s.status==='on');
  const max = Math.max(1, ...SYSTEMS.map(s=>s.visits||0));
  const th = (k,l)=>`<th data-sort="${k}" tabindex="0" class="${filters.sort.k===k?'sorted':''}" title="فرز">${l}<span class="arr">${filters.sort.k===k?(filters.sort.dir>0?'▲':'▼'):'↕'}</span></th>`;
  return `
    <div class="tools">
      <div class="chips">${['all',...cats].map(c=>`<button type="button" data-cat="${esc(c)}" aria-pressed="${filters.category===c}">${c==='all'?'جميع الأنظمة':`${esc(catIcon(c))} ${esc(c)}`}<span class="num">${fmt(c==='all'?visible.length:visible.filter(s=>s.category===c).length)}</span></button>`).join('')}</div>
      <div class="right">
        <label class="searchbox"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="ابحث باسم النظام أو وصفه" value="${esc(filters.q)}"><kbd>/</kbd></label>
        ${addBtn()}
      </div>
    </div>
    <div class="tabs">
      ${QUICK.map(([k,l])=>`<button type="button" data-quick="${k}" aria-pressed="${filters.quick===k}">${l}</button>`).join('')}
      ${isUnlocked()?`<span class="sep"></span>${[['all','كل الحالات'],['on','المتاحة'],['off','المعطّلة']].map(([k,l])=>`<button type="button" data-status="${k}" aria-pressed="${filters.status===k}">${l}</button>`).join('')}`:''}
    </div>
    <div class="scroll"><table>
      <thead><tr><th>م</th><th style="width:32px"></th>${th('name','النظام')}${th('category','التصنيف')}${th('status','الحالة')}${th('visits','الاستخدام')}${th('updated','آخر تحديث')}<th></th></tr></thead>
      <tbody>${rows.length ? rows.map((s,i)=>`<tr class="${s.status==='on'?'':'is-off'}">
        <td class="idx num">${fmt(i+1)}</td>
        <td>${favBtn(s)}</td>
        <td><div class="sysc"><span class="ini emo">${esc(s.icon)||'📁'}</span><div><div class="nm">${esc(s.name)}</div><div class="ds">${esc(s.desc)}${s.lastOpened?` · فُتح ${timeAgo(s.lastOpened)}`:''}</div></div></div></td>
        <td><span class="cat">${esc(s.category)}</span></td>
        <td>${statusPill(s)}</td>
        <td><div class="bar"><i style="width:${Math.max(6, Math.round((s.visits||0)/max*80))}px"></i><span class="num">${fmt(s.visits)}</span></div></td>
        <td class="num">${dateAr(s.updated)}</td>
        <td><div class="acts">${adminBtns(s,'ghost')}<a class="open" ${openAttrs(s)}>${openLabel(s)} ←</a></div></td>
      </tr>`).join('') : `<tr><td colspan="8" class="empty">${emptyText()}</td></tr>`}</tbody>
    </table></div>
    <div class="foot"><span>${QUICK_TITLES[filters.quick]} — يظهر ${fmt(rows.length)} من ${fmt(visible.length)} نظام</span><span>اضغط على عنوان أي عمود للفرز، أو على / للبحث</span></div>`;
}

/* ---------------- Render ---------------- */
function renderTable(keepFocus){
  const active = document.activeElement;
  const refocus = keepFocus || (active && active.id==='q');
  const caret = refocus && active && active.id==='q' ? active.selectionStart : null;
  renderSummary();
  document.getElementById('stage').innerHTML = viewMerged(getFiltered());
  if(refocus){
    const i = document.getElementById('q');
    if(i){ i.focus(); const p = caret ?? i.value.length; try{ i.setSelectionRange(p,p); }catch(e){} }
  }
}
function renderStats(){ renderTable(); }

function renderOrderList(){
  const wrap = document.getElementById('orderList');
  if(!wrap) return;
  if(!SYSTEMS.length){ wrap.innerHTML = `<div style="color:var(--muted);font-size:12.5px;">لا توجد أنظمة بعد</div>`; return; }
  wrap.innerHTML = SYSTEMS.map((s,i)=>`
    <div class="order-row">
      <span>${esc(s.icon)||'📁'}</span>
      <span class="nm">${esc(s.name)}</span>
      <button class="mini-btn" data-up="${s.id}" ${i===0?'disabled':''} title="تحريك للأعلى"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      <button class="mini-btn" data-down="${s.id}" ${i===SYSTEMS.length-1?'disabled':''} title="تحريك للأسفل"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>
    </div>`).join('');
  wrap.querySelectorAll('[data-up]').forEach(btn=> btn.onclick = ()=> moveSystem(btn.dataset.up, -1));
  wrap.querySelectorAll('[data-down]').forEach(btn=> btn.onclick = ()=> moveSystem(btn.dataset.down, 1));
}
async function moveSystem(id, dir){
  const idx = SYSTEMS.findIndex(s=>s.id===id);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=SYSTEMS.length) return;
  const a = SYSTEMS[idx], b = SYSTEMS[swapIdx];
  const aOrder = a.order ?? idx, bOrder = b.order ?? swapIdx;
  try{
    await updateDoc(doc(db, COL, a.id), {order: bOrder});
    await updateDoc(doc(db, COL, b.id), {order: aOrder});
  }catch(e){ console.error(e); showToast('تعذّر تغيير الترتيب'); }
}

function renderCatManageList(){
  const wrap = document.getElementById('catManageList');
  if(!wrap) return;
  if(!CATS.length){ wrap.innerHTML = `<div style="color:var(--muted);font-size:12.5px;">لا توجد تصنيفات بعد</div>`; return; }
  wrap.innerHTML = CATS.map(c=>`
    <div class="cat-row">
      <span>${esc(c.icon)||'🏷️'}</span>
      <span class="nm">${esc(c.name)}</span>
      <button class="mini-btn" data-editcat="${c.id}" title="تعديل"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="mini-btn" data-delcat="${c.id}" title="حذف"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
    </div>`).join('');
  wrap.querySelectorAll('[data-editcat]').forEach(btn=>{
    btn.onclick = ()=> requireGate(async ()=>{
      const c = CATS.find(x=>x.id===btn.dataset.editcat); if(!c) return;
      const newName = prompt('اسم التصنيف:', c.name); if(newName===null) return;
      const newIcon = prompt('أيقونة التصنيف (رمز تعبيري):', c.icon||'🏷️'); if(newIcon===null) return;
      try{ await updateDoc(doc(db,'portal_categories', c.id), {name:newName.trim()||c.name, icon:newIcon.trim()||'🏷️'}); showToast('تم تحديث التصنيف'); }
      catch(e){ console.error(e); showToast('تعذّر تحديث التصنيف'); }
    });
  });
  wrap.querySelectorAll('[data-delcat]').forEach(btn=>{
    btn.onclick = ()=> requireGate(async ()=>{
      const c = CATS.find(x=>x.id===btn.dataset.delcat); if(!c) return;
      if(!confirm(`حذف تصنيف "${c.name}"؟ (لن يؤثر على الأنظمة المستخدمة له حاليًا)`)) return;
      try{ await deleteDoc(doc(db,'portal_categories', c.id)); showToast('تم حذف التصنيف'); }
      catch(e){ console.error(e); showToast('تعذّر حذف التصنيف'); }
    });
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ---------------- Modal (add / edit) ---------------- */
function openModal(system){
  editingId = system ? system.id : null;
  pendingHtml = null;
  document.getElementById('modalTitle').textContent = system ? "تعديل النظام" : "إضافة نظام جديد";
  document.getElementById('f_name').value = system?.name || "";
  renderIconPicker(system?.icon || "📁");
  document.getElementById('f_category').value = system?.category || (filters.category!=='all' ? filters.category : "");
  document.getElementById('f_desc').value = system?.desc || "";
  document.getElementById('f_url').value = system?.url && system.url!=='#' ? system.url : "";
  document.getElementById('f_status').value = system?.status || "on";
  document.getElementById('f_html').value = "";
  document.getElementById('f_html_hint').textContent = system?.htmlFileName ? `يوجد ملف مرفق حاليًا: ${system.htmlFileName} — اختر ملفًا جديدًا لاستبداله` : "";
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('f_name').focus(), 50);
}
function renderIconPicker(selected){
  document.getElementById('f_icon').value = selected;
  const wrap = document.getElementById('iconPicker');
  wrap.innerHTML = ICON_CHOICES.map(ic=>`<button type="button" class="icon-choice ${ic===selected?'sel':''}" data-ic="${ic}">${ic}</button>`).join('');
  wrap.querySelectorAll('.icon-choice').forEach(btn=>{
    btn.onclick = ()=>{
      document.getElementById('f_icon').value = btn.dataset.ic;
      wrap.querySelectorAll('.icon-choice').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
    };
  });
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); editingId = null; }

async function saveModal(){
  const name = document.getElementById('f_name').value.trim();
  const category = document.getElementById('f_category').value.trim();
  if(!name || !category){ showToast('يرجى إدخال اسم النظام والتصنيف'); return; }
  const data = {
    name,
    icon: document.getElementById('f_icon').value.trim() || "📁",
    category,
    desc: document.getElementById('f_desc').value.trim(),
    url: document.getElementById('f_url').value.trim() || "#",
    status: document.getElementById('f_status').value,
    updated: todayStr(),
    visits: editingId ? (SYSTEMS.find(s=>s.id===editingId)?.visits || 0) : 0,
    order: editingId ? (SYSTEMS.find(s=>s.id===editingId)?.order ?? 999) : (SYSTEMS.length ? Math.max(...SYSTEMS.map(s=>s.order??0))+1 : 0),
  };
  if(!editingId){ data.favorite = false; data.createdAt = Date.now(); }
  if(pendingHtml){ data.htmlFileName = pendingHtml.name; data.htmlContent = pendingHtml.content; }
  else if(!editingId){ data.htmlFileName = null; data.htmlContent = null; }
  try{
    if(editingId){ await updateDoc(doc(db, COL, editingId), data); showToast('تم تحديث النظام بنجاح'); }
    else{ await setDoc(doc(db, COL, newId()), data); showToast('تمت إضافة النظام بنجاح'); }
    closeModal();
  }catch(e){ console.error(e); showToast('تعذّر حفظ النظام، حاول مجددًا'); }
}

async function toggleStatus(id){
  const s = SYSTEMS.find(x=>x.id===id);
  if(!s) return;
  try{
    await updateDoc(doc(db, COL, id), { status: s.status==='on' ? 'off' : 'on', updated: todayStr() });
    showToast(`تم ${s.status==='on' ? 'تعطيل' : 'تفعيل'} "${s.name}"`);
  }catch(e){ console.error(e); showToast('تعذّر تحديث الحالة'); }
}
async function deleteSystem(id){
  const s = SYSTEMS.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`هل تريد حذف "${s.name}" نهائيًا؟`)) return;
  try{ await deleteDoc(doc(db, COL, id)); showToast(`تم حذف "${s.name}"`); }
  catch(e){ console.error(e); showToast('تعذّر حذف النظام'); }
}

async function openSystemById(id){
  const s = SYSTEMS.find(x=>x.id===id);
  if(!s) return;
  if(s.url && s.url!=='#'){ window.open(s.url, '_blank'); }
  else if(s.htmlContent){
    const blob = new Blob([s.htmlContent], {type:'text/html'});
    window.open(URL.createObjectURL(blob), '_blank');
  } else {
    showToast('لم يتم ربط رابط فعلي أو ملف HTML بهذا النظام بعد — عدّله لإضافته');
    return;
  }
  try{ await updateDoc(doc(db, COL, id), { visits: increment(1), lastOpened: Date.now() }); }catch(e){ console.error(e); }
}

/* ---------------- Event wiring (one delegated handler for all views) ---------------- */
const stage = document.getElementById('stage');
stage.addEventListener('input', e=>{
  if(e.target.id==='q'){ filters.q = e.target.value; renderTable(true); }
});
stage.addEventListener('change', e=>{
});
stage.addEventListener('click', e=>{
  const el = sel => e.target.closest(sel);
  let b;
  if((b = el('[data-open]'))){ e.preventDefault(); openSystemById(b.dataset.id); return; }
  if((b = el('[data-fav]'))){
    const s = SYSTEMS.find(x=>x.id===b.dataset.fav);
    if(s) updateDoc(doc(db, COL, s.id), { favorite: !s.favorite }).catch(err=>{ console.error(err); showToast('تعذّر تحديث المفضلة'); });
    return;
  }
  if((b = el('[data-cat]'))){ filters.category = b.dataset.cat; renderTable(); return; }
  if((b = el('[data-quick]'))){ filters.quick = b.dataset.quick; filters.sort = {k:null,dir:1}; renderTable(); return; }
  if((b = el('[data-status]'))){ filters.status = b.dataset.status; renderTable(); return; }
  if((b = el('th[data-sort]'))){
    const k = b.dataset.sort;
    filters.sort = filters.sort.k===k ? {k, dir:-filters.sort.dir} : {k, dir:(k==='visits'||k==='updated')?-1:1};
    renderTable(); return;
  }
  if(el('[data-add]')){ openModal(null); return; }
  if((b = el('[data-toggle]'))){ const id=b.dataset.id; requireGate(()=> toggleStatus(id)); return; }
  if((b = el('[data-edit]'))){ const id=b.dataset.id; requireGate(()=> openModal(SYSTEMS.find(x=>x.id===id))); return; }
  if((b = el('[data-delete]'))){ const id=b.dataset.id; requireGate(()=> deleteSystem(id)); return; }
});
stage.addEventListener('keydown', e=>{
  const th = e.target.closest('th[data-sort]');
  if(th && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); th.click(); }
});
document.addEventListener('keydown', e=>{
  const tag = (document.activeElement?.tagName || '');
  if(e.key==='/' && !['INPUT','TEXTAREA','SELECT'].includes(tag) && !document.querySelector('.modal-overlay.show')){
    e.preventDefault(); document.getElementById('q')?.focus();
  }
  if(e.key==='Escape'){ document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show')); }
});

document.getElementById('logoutLink').addEventListener('click', e=>{ e.preventDefault(); showToast('تم تسجيل الخروج (عرض توضيحي)'); });
document.getElementById('f_html').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    if(reader.result.length > MAX_HTML_SIZE){
      alert('حجم الملف كبير جدًا للتخزين (الحد الأقصى تقريبًا 900 كيلوبايت). استخدم رابط الموقع بدلاً من ذلك.');
      e.target.value = '';
      return;
    }
    pendingHtml = { name:file.name, content:reader.result };
    document.getElementById('f_html_hint').textContent = `تم اختيار: ${file.name}`;
  };
  reader.readAsText(file);
});
document.getElementById('refreshBtn').addEventListener('click', ()=>{ fillCategorySelect(); showToast('تم تحديث الصفحة ✓'); });
document.getElementById('closeBtn').addEventListener('click', ()=>{ showToast('يمكنك إغلاق النافذة الآن'); window.close(); });
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalSave').addEventListener('click', saveModal);
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* ---------------- Password gate for edit/delete/disable ---------------- */
const ICON_LOCKED = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const ICON_UNLOCKED = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.8"/></svg>`;
function updateLockIcon(){
  const unlocked = isUnlocked();
  const btn = document.getElementById('lockBtn');
  btn.innerHTML = unlocked ? ICON_UNLOCKED : ICON_LOCKED;
  btn.classList.toggle('unlocked', unlocked);
  btn.title = unlocked ? 'وضع الإدارة مفتوح — اضغط لإعادة القفل' : 'مقفل — اضغط لإدخال كلمة المرور';
}
document.getElementById('lockBtn').addEventListener('click', ()=>{
  if(isUnlocked()){
    sessionStorage.removeItem('gate_unlocked');
    filters.status = 'all';
    updateLockIcon(); renderTable();
    showToast('تم قفل صلاحيات التعديل والحذف والتعطيل');
  } else {
    requireGate(()=>{ sessionStorage.setItem('gate_unlocked','1'); updateLockIcon(); renderTable(); showToast('تم فتح صلاحيات التعديل والحذف والتعطيل ✓'); });
  }
});
updateLockIcon();

function requireGate(action){
  if(!ADMIN_PASSWORD){ action(); return; }
  if(isUnlocked()){ action(); return; }
  pendingGateAction = action;
  document.getElementById('gatePassInput').value = '';
  document.getElementById('gateModal').classList.add('show');
  setTimeout(()=> document.getElementById('gatePassInput').focus(), 50);
}
document.getElementById('gateClose').addEventListener('click', ()=>{ document.getElementById('gateModal').classList.remove('show'); pendingGateAction=null; });
document.getElementById('gateCancel').addEventListener('click', ()=>{ document.getElementById('gateModal').classList.remove('show'); pendingGateAction=null; });
document.getElementById('gateSubmit').addEventListener('click', ()=>{
  const val = document.getElementById('gatePassInput').value;
  if(val === ADMIN_PASSWORD){
    sessionStorage.setItem('gate_unlocked','1');
    updateLockIcon(); renderTable();
    document.getElementById('gateModal').classList.remove('show');
    const act = pendingGateAction; pendingGateAction=null;
    if(act) act();
  } else { showToast('كلمة المرور غير صحيحة'); }
});
document.getElementById('gatePassInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('gateSubmit').click(); });

/* ---------------- Settings modal ---------------- */
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('set_name').value = PORTAL_NAME;
  document.getElementById('set_sub').value = PORTAL_SUB;
  document.getElementById('set_icon').value = PORTAL_ICON;
  document.getElementById('set_curpass').value = '';
  document.getElementById('set_newpass').value = '';
  renderOrderList();
  renderCatManageList();
  document.getElementById('settingsModal').classList.add('show');
});
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }
document.getElementById('settingsClose').addEventListener('click', closeSettings);
document.getElementById('settingsCloseBottom').addEventListener('click', closeSettings);
document.getElementById('settingsModal').addEventListener('click', e=>{ if(e.target.id==='settingsModal') closeSettings(); });

document.getElementById('saveBranding').addEventListener('click', async ()=>{
  const name = document.getElementById('set_name').value.trim() || PORTAL_NAME;
  const sub = document.getElementById('set_sub').value.trim();
  const icon = document.getElementById('set_icon').value.trim() || PORTAL_ICON;
  try{
    await setDoc(settingsDocRef, {portalName:name, portalIcon:icon, portalSub:sub}, {merge:true});
    showToast('تم حفظ اسم وأيقونة البوابة ✓');
  }catch(e){ console.error(e); showToast('تعذّر الحفظ'); }
});
document.getElementById('addCatBtn').addEventListener('click', ()=> requireGate(async ()=>{
  const name = document.getElementById('newCatName').value.trim();
  const icon = document.getElementById('newCatIcon').value.trim() || '🏷️';
  if(!name){ showToast('أدخل اسم التصنيف'); return; }
  try{
    await addDoc(categoriesCol, {name, icon});
    document.getElementById('newCatName').value = '';
    document.getElementById('newCatIcon').value = '';
    showToast('تمت إضافة التصنيف ✓');
  }catch(e){ console.error(e); showToast('تعذّر إضافة التصنيف'); }
}));

document.getElementById('savePassword').addEventListener('click', async ()=>{
  const cur = document.getElementById('set_curpass').value;
  const next = document.getElementById('set_newpass').value;
  if(ADMIN_PASSWORD && cur !== ADMIN_PASSWORD){ showToast('كلمة المرور الحالية غير صحيحة'); return; }
  try{
    await setDoc(settingsDocRef, {adminPassword: next}, {merge:true});
    sessionStorage.removeItem('gate_unlocked');
    updateLockIcon(); renderTable();
    showToast(next ? 'تم تفعيل حماية التعديل/الحذف/التعطيل بكلمة المرور ✓' : 'تم إلغاء حماية التعديل/الحذف/التعطيل ✓');
    document.getElementById('set_curpass').value = '';
    document.getElementById('set_newpass').value = '';
  }catch(e){ console.error(e); showToast('تعذّر حفظ كلمة المرور'); }
});

/* ---------------- Boot ---------------- */
renderTable();
function bootData(){
  ensureSeeded().then(subscribe).catch(e=>{
    console.error('Boot failed:', e);
    setSyncStatus(false, 'تعذّر بدء التشغيل');
    showToast('تعذّر بدء تشغيل البوابة — تحقق من الاتصال بقاعدة البيانات');
    subscribe();
  });
}
signInAnonymously(auth).then(bootData).catch(e=>{
  console.error('Anonymous sign-in failed:', e);
  showToast('تنبيه: تسجيل الدخول المجهول غير مفعّل من Firebase Console — إن كانت قواعد Firestore لا تزال مفتوحة فالبوابة ستعمل بشكل طبيعي رغم ذلك');
  bootData();
});
</script>
